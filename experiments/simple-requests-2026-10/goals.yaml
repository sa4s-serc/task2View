# Goal set (exploratory, 2026-10-21): the ten pilot requests, four of them rewritten short and direct
# as a collaborator suggested, to see whether long natural-language requests add complexity to the pipeline.
# Each case replaces the verbose pilot request with the same id (experiments/pilot-2026-10/goals.yaml,
# frozen; its text is kept under `replaces`). The collaborator's message labels the DevOps request
# "GR10-Q1" as well; it rewrites GR10-Q2, the DevOps request of the pilot.
#
# expected: facts a good answer shows, written before any run (none yet).

systems:
  progetto-is: ~/t2v-subjects/task2view/progetto-is/Progetto-IS-main-English
  gr10: ~/t2v-subjects/task2view/gr10/progetto_ing_software_gr10-main-English

cases:
  GR10-Q1:
    system: gr10
    goal: "I am a software architect, and I would like a high-level component view of the system."
    replaces: "I am a software architect. I need to review the overall organization of the system before planning its future evolution. I want to understand the main architectural components, their responsibilities, how the system is decomposed into different layers or subsystems, and the main dependencies among them. I also need to identify how user-facing functionality, application logic, domain entities, and data persistence are separated and how these parts collaborate to provide the main system functionalities."
    expected: []
  GR10-Q2:
    system: gr10
    goal: "I am a DevOps engineer, and I would like a complete deployment view of the system."
    replaces: "I am a DevOps engineer. I need to deploy and configure the system in a new execution environment. Before preparing the deployment, I need to understand which runtime environments and software artifacts are required, where the application and its data are executed and stored, and how the main runtime elements communicate with each other. I also need to identify the technologies and runtime dependencies involved in the communication between the application and the database."
    expected: []
  GR10-Q4:
    system: gr10
    goal: "I am a software analyst, and I would like a use case diagram showing the functionalities provided by the system."
    replaces: "I am a business analyst. I need to understand at a high level how a system for reporting and managing problems in a municipal area is expected to work. I know that the application should allow people to report issues in the territory and support the municipality in managing them, but I do not yet know the specific user roles or the functionalities available to each of them. I need to identify the main types of users that interact with the system, the main goals they can achieve through it, and how the different functionalities are related to each other."
    expected: []
  IS-reg-L1:
    system: progetto-is
    goal: "I am an integration tester, and I would like a dynamic view of the user registration functionality."
    replaces: "I am an integration tester. I need to test the user registration functionality and understand which system components are involved and how they interact."
    expected: []

  # Unchanged pilot requests (same text as experiments/pilot-2026-10/goals.yaml), so the set has all 10.
  IS-seat-L1:
    system: progetto-is
    goal: "I am a software developer. I need to modify the seat booking functionality and understand the main system components involved and how they interact."
    expected: []
  IS-seat-L2:
    system: progetto-is
    goal: "I am a software developer. I need to modify the seat booking functionality to introduce new booking rules. Before changing the code, I need to understand the main components involved in this functionality, their responsibilities, and how they interact with each other. I also want to identify which parts of the system may be affected by the modification."
    expected: []
  IS-seat-L3:
    system: progetto-is
    goal: "I am a software developer. I need to modify the seat booking functionality to introduce new booking rules. Before making changes to the code, I need to understand the high-level architecture supporting this functionality. I want to identify the main components involved in the booking process, their responsibilities, and the interactions and dependencies among them. In particular, I need to understand which components are responsible for handling booking requests, checking seat availability, applying booking rules, managing and storing reservations, and interacting with external services such as the notification service. This understanding will help me identify which parts of the system need to be modified and which other components may be affected by the changes."
    expected: []
  IS-reg-L2:
    system: progetto-is
    goal: "I am an integration tester. I need to design integration tests for the user registration functionality. Before defining the tests, I need to understand the main components involved in registration, their responsibilities, and how they interact when a new user creates an account. I also need to identify the main integration points that should be exercised during the tests."
    expected: []
  IS-reg-L3:
    system: progetto-is
    goal: "I am an integration tester. I need to design integration tests for the user registration functionality. Before defining the tests, I need to understand the high-level architecture supporting this functionality. I want to identify the main components involved in the registration process, their responsibilities, and the interactions and dependencies among them. In particular, I need to understand which components handle the registration request, validate the user's personal information and selected role, manage role-specific data such as the student ID or librarian identifier, verify the validity and uniqueness of the account, and persist the newly created user. I also need to understand how these components collaborate when invalid or already existing user data is provided, so that I can identify the main integration points and interactions that should be covered by the tests."
    expected: []
  GR10-Q3:
    system: gr10
    goal: "I am a database engineer. I need to modify the persistence layer to support future changes to the management of municipal reports. Before modifying the database, I need to understand the main data entities stored by the system, the relationships among them, and which information must be persisted throughout the lifecycle of a report. In particular, I need to understand how users, reports, locations, categories, states, state changes, internal notes, and notifications are related, and which parts of the application depend on this persisted information."
    expected: []
