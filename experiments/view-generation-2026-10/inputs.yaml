# Input sheet for the central question (2026-10-29):
#   Given the entity of interest, a stakeholder with their perspective, their concern, the aspect it is
#   about and the viewpoint / model kind that frames it, can a view be generated that addresses the
#   concern? The architecture is not given; it must be derived from the repository.
#
# Terms from ISO/IEC/IEEE 42010:2022, clause 3:
#   entity_of_interest (3.12), stakeholder (3.17), perspective = stakeholder perspective (3.18),
#   concern (3.10), aspect (3.9), viewpoint (3.8) / model_kind (3.15).
#
# request          the stakeholder's text as given to the generators (short rewrite where one exists)
# original_request the pilot's long text, for the four requests that were rewritten short
# concern          a label from the CodeToDiagram concern vocabulary (dataset/filtered_dataset.csv):
#                  general, control_flow, data_flow, deployment, connectivity, security, performance,
#                  scheduling; several labels are comma-separated, as in that dataset
# concern_details  what the stakeholder specifically wants to know, taken from the request text
# `# inferred` marks values not stated in the request. Every value is a draft for the researchers to correct.

entities_of_interest:
  gr10:
    description: desktop application for reporting and managing problems in a municipal area
    repository: ~/t2v-subjects/task2view/gr10/progetto_ing_software_gr10-main-English
  progetto-is:
    description: application for booking study-room seats, with student and librarian users
    repository: ~/t2v-subjects/task2view/progetto-is/Progetto-IS-main-English

cases:
  GR10-Q1:
    request: "I am a software architect, and I would like a high-level component view of the system."
    original_request: "I am a software architect. I need to review the overall organization of the system before planning its future evolution. I want to understand the main architectural components, their responsibilities, how the system is decomposed into different layers or subsystems, and the main dependencies among them. I also need to identify how user-facing functionality, application logic, domain entities, and data persistence are separated and how these parts collaborate to provide the main system functionalities."
    entity_of_interest: gr10
    stakeholder: software architect
    perspective: the whole system at a high level, before planning its evolution
    concern: general
    concern_details:
      - main architectural components and their responsibilities
      - decomposition into layers or subsystems
      - main dependencies among them
      - separation of user interface, application logic, domain entities and persistence, and how they collaborate
    aspect: structural
    viewpoint: component
    model_kind: UML component diagram

  GR10-Q2:
    request: "I am a DevOps engineer, and I would like a complete deployment view of the system."
    original_request: "I am a DevOps engineer. I need to deploy and configure the system in a new execution environment. Before preparing the deployment, I need to understand which runtime environments and software artifacts are required, where the application and its data are executed and stored, and how the main runtime elements communicate with each other. I also need to identify the technologies and runtime dependencies involved in the communication between the application and the database."
    entity_of_interest: gr10
    stakeholder: DevOps engineer
    perspective: runtime and operations; deploying the system in a new environment
    concern: deployment, connectivity
    concern_details:
      - required runtime environments and software artifacts
      - where the application runs and where its data is stored
      - how the main runtime elements communicate
      - technologies and runtime dependencies between the application and the database
    aspect: structural (runtime)
    viewpoint: deployment
    model_kind: UML deployment diagram

  GR10-Q4:
    request: "I am a software analyst, and I would like a use case diagram showing the functionalities provided by the system."
    original_request: "I am a business analyst. I need to understand at a high level how a system for reporting and managing problems in a municipal area is expected to work. I know that the application should allow people to report issues in the territory and support the municipality in managing them, but I do not yet know the specific user roles or the functionalities available to each of them. I need to identify the main types of users that interact with the system, the main goals they can achieve through it, and how the different functionalities are related to each other."
    entity_of_interest: gr10
    stakeholder: software analyst
    perspective: what the system offers its users, without knowing the user roles yet
    concern: general            # inferred; the vocabulary has no label for functionality
    concern_details:
      - main types of users that interact with the system
      - goals each of them can achieve through it
      - how the functionalities are related to each other
    aspect: functional
    viewpoint: use case
    model_kind: UML use case diagram

  GR10-Q3:
    request: "I am a database engineer. I need to modify the persistence layer to support future changes to the management of municipal reports. Before modifying the database, I need to understand the main data entities stored by the system, the relationships among them, and which information must be persisted throughout the lifecycle of a report. In particular, I need to understand how users, reports, locations, categories, states, state changes, internal notes, and notifications are related, and which parts of the application depend on this persisted information."
    entity_of_interest: gr10
    stakeholder: database engineer
    perspective: the persistence layer, before changing how reports are managed
    concern: general            # inferred; the vocabulary has no label for data model
    concern_details:
      - main data entities stored and their relationships
      - information persisted throughout the lifecycle of a report
      - how users, reports, locations, categories, states, state changes, internal notes and notifications are related
      - which parts of the application depend on the persisted information
    aspect: informational
    viewpoint: data model       # inferred
    model_kind: UML class diagram   # inferred
    note: the last detail is about code depending on data; it may need a second view (inferred)

  IS-reg-L1:
    request: "I am an integration tester, and I would like a dynamic view of the user registration functionality."
    original_request: "I am an integration tester. I need to test the user registration functionality and understand which system components are involved and how they interact."
    entity_of_interest: progetto-is
    stakeholder: integration tester
    perspective: testing the user registration feature end to end
    concern: control_flow       # inferred
    concern_details:
      - system components involved in user registration
      - how they interact
    aspect: behavioural
    viewpoint: dynamic
    model_kind: UML sequence diagram

  IS-reg-L2:
    request: "I am an integration tester. I need to design integration tests for the user registration functionality. Before defining the tests, I need to understand the main components involved in registration, their responsibilities, and how they interact when a new user creates an account. I also need to identify the main integration points that should be exercised during the tests."
    entity_of_interest: progetto-is
    stakeholder: integration tester
    perspective: designing integration tests for user registration
    concern: control_flow, connectivity   # inferred
    concern_details:
      - main components involved in registration and their responsibilities
      - how they interact when a new user creates an account
      - main integration points to exercise in the tests
    aspect: behavioural, structural   # inferred
    viewpoint: dynamic                # inferred; components + interactions could also be a component view
    model_kind: UML sequence diagram  # inferred

  IS-reg-L3:
    request: "I am an integration tester. I need to design integration tests for the user registration functionality. Before defining the tests, I need to understand the high-level architecture supporting this functionality. I want to identify the main components involved in the registration process, their responsibilities, and the interactions and dependencies among them. In particular, I need to understand which components handle the registration request, validate the user's personal information and selected role, manage role-specific data such as the student ID or librarian identifier, verify the validity and uniqueness of the account, and persist the newly created user. I also need to understand how these components collaborate when invalid or already existing user data is provided, so that I can identify the main integration points and interactions that should be covered by the tests."
    entity_of_interest: progetto-is
    stakeholder: integration tester
    perspective: designing integration tests for user registration, at the level of the architecture
    concern: control_flow, connectivity   # inferred
    concern_details:
      - main components in the registration process, their responsibilities, interactions and dependencies
      - which components handle the request, validate personal data and role, manage role-specific data (student ID, librarian identifier), check validity and uniqueness of the account, and persist the new user
      - how they collaborate when invalid or already existing data is provided
      - main integration points and interactions the tests should cover
    aspect: behavioural, structural   # inferred
    viewpoint: dynamic                # inferred; the "dependencies" detail is structural
    model_kind: UML sequence diagram  # inferred

  IS-seat-L1:
    request: "I am a software developer. I need to modify the seat booking functionality and understand the main system components involved and how they interact."
    entity_of_interest: progetto-is
    stakeholder: software developer
    perspective: about to modify the seat booking feature
    concern: control_flow       # inferred
    concern_details:
      - main system components involved in seat booking
      - how they interact
    aspect: structural, behavioural   # inferred
    viewpoint: component              # inferred; "how they interact" could also be a dynamic view
    model_kind: UML component diagram # inferred

  IS-seat-L2:
    request: "I am a software developer. I need to modify the seat booking functionality to introduce new booking rules. Before changing the code, I need to understand the main components involved in this functionality, their responsibilities, and how they interact with each other. I also want to identify which parts of the system may be affected by the modification."
    entity_of_interest: progetto-is
    stakeholder: software developer
    perspective: about to add new booking rules to seat booking
    concern: general            # inferred; change impact has no label in the vocabulary
    concern_details:
      - main components involved in seat booking and their responsibilities
      - how they interact with each other
      - which parts of the system may be affected by the modification
    aspect: structural                # inferred
    viewpoint: component              # inferred
    model_kind: UML component diagram # inferred

  IS-seat-L3:
    request: "I am a software developer. I need to modify the seat booking functionality to introduce new booking rules. Before making changes to the code, I need to understand the high-level architecture supporting this functionality. I want to identify the main components involved in the booking process, their responsibilities, and the interactions and dependencies among them. In particular, I need to understand which components are responsible for handling booking requests, checking seat availability, applying booking rules, managing and storing reservations, and interacting with external services such as the notification service. This understanding will help me identify which parts of the system need to be modified and which other components may be affected by the changes."
    entity_of_interest: progetto-is
    stakeholder: software developer
    perspective: about to add new booking rules; needs the architecture behind seat booking
    concern: control_flow, connectivity   # inferred; connectivity for the external notification service
    concern_details:
      - main components in the booking process, their responsibilities, interactions and dependencies
      - which components handle booking requests, check seat availability, apply booking rules, manage and store reservations, and interact with external services such as notifications
      - which parts need to be modified and which other components may be affected
    aspect: structural, behavioural   # inferred
    viewpoint: component              # inferred
    model_kind: UML component diagram # inferred
