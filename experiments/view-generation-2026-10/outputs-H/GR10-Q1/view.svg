al)</text><g class="entity" data-qualified-name="GMN6" id="ent0007" data-source-line="20"><path d="M500.15,41.5 L500.15,75 L450.57,79 L500.15,83 L500.15,116.5 A0,0 0 0 0 500.15,116.5 L740.081,116.5 A0,0 0 0 0 740.081,116.5 L740.081,51.5 L730.081,41.5 L500.15,41.5 A0,0 0 0 0 500.15,41.5" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M730.081,41.5 L730.081,51.5 L740.081,51.5 L730.081,41.5" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="506.15" y="56.51" fill="#000" font-size="13" textLength="200.891" font-family="Helvetica">Seven of ten screens enter Control</text><text x="506.15" y="69.51" fill="#000" font-size="13" textLength="218.931" font-family="Helvetica">through the SystemServicesController</text><text x="506.15" y="82.51" fill="#000" font-size="13" textLength="185.72" font-family="Helvetica">facade; the login screen uses its</text><text x="506.15" y="95.51" fill="#000" font-size="13" textLength="182.089" font-family="Helvetica">login controller directly, and two</text><text x="506.15" y="108.51" fill="#000" font-size="13" textLength="147.399" font-family="Helvetica">screens call no controller.</text></g><g class="entity" data-qualified-name="GMN9" id="ent0010" data-source-line="27"><path d="M6,343.5 L6,418.5 A0,0 0 0 0 6,418.5 L232.226,418.5 A0,0 0 0 0 232.226,418.5 L232.226,385 L282.21,381 L232.226,377 L232.226,353.5 L222.226,343.5 L6,343.5 A0,0 0 0 0 6,343.5" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M222.226,343.5 L222.226,353.5 L232.226,353.5 L222.226,343.5" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="12" y="358.51" fill="#000" font-size="13" textLength="204.515" font-family="Helvetica">JPA-annotated domain classes and</text><text x="12" y="371.51" fill="#000" font-size="13" textLength="184.253" font-family="Helvetica">the report and user services live</text><text x="12" y="384.51" fill="#000" font-size="13" textLength="184.983" font-family="Helvetica">here; the services call Database</text><text x="12" y="397.51" fill="#000" font-size="13" textLength="205.226" font-family="Helvetica">directly. Layers exchange Map data</text><text x="12" y="410.51" fill="#000" font-size="13" textLength="151.036" font-family="Helvetica">instead of domain objects.</text></g><!--link screens to controllers--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk12" data-source-line="34" data-link-type="dependency"><path d="M404.88,117.41 C444.14,140.08 489.72,166.399 528.99,189.079" style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;" fill="none" id="screens-to-controllers" codeLine="34"/><polygon points="533.32,191.58,527.527,183.615,528.99,189.079,523.526,190.543,533.32,191.58" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="477.85" y="158.01" fill="#000" font-size="13" textLength="89.584" font-family="Helvetica">calls controllers</text></g><!--link screens to domain--><g class="link" data-entity-1="ent0001" data-entity-2="ent0003" id="lnk13" data-source-line="35" data-link-type="dependency"><path d="M335.12,117.29 C330.75,149.88 325.11,192 325.11,192 C325.11,192 325.11,268 325.11,268 C325.11,268 348.791,305.879 369.151,338.469" style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;" fill="none" id="screens-to-domain" codeLine="35"/><polygon points="371.8,342.71,370.424,332.958,369.151,338.469,363.639,337.196,371.8,342.71" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="326.11" y="233.51" fill="#000" font-size="13" textLength="122.84" font-family="Helvetica">uses ReportCategory</text></g><!--link controllers to domain--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" id="lnk14" data-source-line="36" data-link-type="dependency"><path d="M547.15,268.41 C516.26,291.08 481.02,316.941 450.13,339.621" style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;" fill="none" id="controllers-to-domain"