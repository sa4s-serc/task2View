# The viewpoints Phase 1 may propose: the UML-expressible viewpoints of the Views & Beyond catalogue
# (Clements et al. 2010) whose content can be recovered from source code and build/config files
# (Fairbanks 2010: module views are visible in code, runtime views partly, allocation views from config).
# Each frames the aspects listed (ids from questions.yaml). Not fitted to any case.
viewpoints:
  use-case:
    model_kind: UML use case diagram
    aspect: functional
    frames: [users]
    shows: the system boundary, the kinds of users and the goals each can achieve
    source: UML 2.5.1 cl. 18; 4+1 scenarios
  module:
    model_kind: UML package diagram
    aspect: structural (module)
    frames: [code-structure]
    shows: how the code is divided into modules or layers and which depends on which
    source: V&B module styles (decomposition, uses, layered)
  component:
    model_kind: UML component diagram
    aspect: structural (component-and-connector)
    frames: [runtime-parts]
    shows: the running parts of the system, the interfaces they offer and need, and how they connect
    source: V&B component-and-connector styles; UML 2.5.1 cl. 11
  data-model:
    model_kind: UML class diagram
    aspect: informational
    frames: [data]
    shows: the persisted entities, their key attributes and their relationships
    source: V&B data model
  interaction:
    model_kind: UML sequence diagram
    aspect: behavioural
    frames: [steps]
    shows: the messages exchanged among the parts in one scenario, in order, with the error path asked about
    source: V&B behaviour documentation; UML 2.5.1 cl. 17
  deployment:
    model_kind: UML deployment diagram
    aspect: structural (allocation)
    frames: [runtime-environment]
    shows: the nodes and execution environments, the deployed artifacts and the communication paths
    source: V&B deployment style; UML 2.5.1 cl. 19
