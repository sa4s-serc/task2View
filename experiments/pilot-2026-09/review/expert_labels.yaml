  - {condition: skill-agent, case: IS-reg-L3, run_dir: outputs/skill-agent/italian-reviewed/IS-reg-L3, verdict: miss,
     problems: [answers-questions], other: [grain], praised: [],
     comment: "essentially ineffective … extremely high-level and does not explain how the functionality is actually implemented"}
  - {condition: skill-agent, case: IS-seat-L1, run_dir: outputs/skill-agent/italian-reviewed/IS-seat-L1, verdict: fit,
     problems: [layers], other: [], praised: [answers-questions],
