# Run-time limits of the ADR-006 pipeline. These are cost and effort bounds,
# not tuned to any repository or goal set. Decided values cite their decision.

investigation:
  max_tasks_per_view: 1           # one evidence agent per view (was 6: the pilot spent 93% of its calls in Phase 5)
  seed_symbols_per_task: 6        # deterministic suggestions offered to the planning agent
  neighbour_suggestions: 4        # 1-hop graph neighbours of the top seeds
  budget_steps:                   # tool-loop steps per evidence task, by Phase 1 detail level
    overview: 12                  # raised from 6/10/14 after the first live trial: 6 steps ran out
    feature: 16                   # before the agent reached its own starting points (2026-10-10)
    detailed: 20

evidence:
  max_read_lines: 200             # lines returned by one `read` tool call
  max_search_hits: 40
  keep_results: 4                 # tool results kept in full; older ones are elided (observation masking)
  excerpt_line_slack: 3           # an excerpt may sit this many lines outside its stated range
  min_confidence: 0.0             # claims below this are kept but marked weak

consolidation:
  helper_kinds: [enum, record]    # attached to the component that uses them most; an unlinked helper stays its own component
  helper_name_suffixes: [Exception, Error, DTO, Dto, Request, Response]

abstraction:                      # ADR-007: parts per structural view (proposed; 3-7 top-level groups, Cowan 2001;
  max_parts:                      # Störrle 2014: comprehension falls with size). Over the cap: drawn by layer.
    overview: 7
    feature: 9
    detailed: 9

