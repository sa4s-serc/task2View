# Inspectable task → concern / viewpoint cues. Phase 2 uses these to boost
# Table 9.1 candidates; it does not invent new viewpoints.
# Longer cue phrases are matched before shorter ones.
# weight: specific domain cues outrank generic verbs such as "modify".
# prefer_viewpoints use CIAO-aligned catalog ids only.

cues:
  - id: behavioural-flow
    weight: 6
    phrases:
      - integration test
      - integration tests
      - how a request
      - how a user
      - processed
      - processing
      - sequence
      - control flow
      - call chain
      - runtime interaction
      - registration
      - login
      - request is
      - execution order
    concerns: [control-flow, functional-suitability]
    prefer_viewpoints: [cnc-runtime]

  - id: structural-change
    weight: 4
    phrases:
      - where do i change
      - which module
      - modify
      - refactor
      - maintain
      - decomposition
      - package
    concerns: [maintainability]
    prefer_viewpoints: [module-decomposition, code-mapping]

  - id: layering
    weight: 6
    phrases:
      - layers
      - layered
      - layering
      - allowed to use
      - dependency rule
      - bced
    concerns: [maintainability, flexibility]
    prefer_viewpoints: [module-decomposition]

  - id: deployment
    weight: 8
    phrases:
      - deploy
      - dockerfile
      - kubernetes
      - infrastructure
      - where does it run
      - blast radius
    concerns: [deployment, reliability]
    prefer_viewpoints: [allocation-deployment]

  - id: security
    weight: 8
    phrases:
      - attack surface
      - trust boundary
      - authentication
      - authorization
      - security
    concerns: [security, data-protection]
    prefer_viewpoints: [context]

  - id: api
    weight: 7
    phrases:
      - api
      - interface
      - integrate with
      - contract
      - endpoint
    concerns: [compatibility, connectivity]
    prefer_viewpoints: [context]

  - id: data
    weight: 8
    phrases:
      - schema
      - persistence
      - database
      - entity
      - data model
    concerns: [compatibility, data-protection]
    prefer_viewpoints: [code-mapping]

  - id: onboarding
    weight: 6
    phrases:
      - new to the codebase
      - get started
      - overview
      - onboarding
    concerns: [general, maintainability]
    prefer_viewpoints: [context, module-decomposition]

  - id: system-context
    weight: 8
    phrases:
      - types of users
      - user roles
      - functionalities available
      - expected to work
      - at a high level
      - business analyst
    concerns: [general, interaction-capability, connectivity]
    prefer_viewpoints: [context]

  - id: architectural-structure
    weight: 6
    phrases:
      - organization of the system
      - main architectural components
      - main components involved
      - their responsibilities
      - how they interact with each other
      - containment
      - subsystems
      - decomposed
      - packages
    concerns: [maintainability]
    prefer_viewpoints: [module-decomposition]
