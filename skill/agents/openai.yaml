interface:
  display_name: Task2View
  short_description: Stakeholder-task architecture view from a repository (single-agent baseline)
  default_prompt: >-
    Generate a stakeholder- and task-guided architecture view.
    I will give a local --code path and a --goal. Follow the Task2View skill.
    Do not run the Task2View multi-agent pipeline.

policy:
  allow_implicit_invocation: true

dependencies:
  tools:
    - type: bash
      description: List and search the subject repository, then write run artifacts
