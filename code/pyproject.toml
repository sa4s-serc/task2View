[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "task2view"
version = "0.1.0"
description = "Stakeholder- and task-guided architecture view generation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "PyYAML>=6.0",
  "jsonschema>=4.22",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
task2view = "task2view.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
task2view = ["knowledge/data/*.yaml", "knowledge/data/*.json", "contracts/schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
