[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "task2view"
version = "0.1.0"
description = "Stakeholder- and task-guided architecture view generation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "PyYAML>=6.0",
  "jsonschema>=4.22",
  "tree-sitter>=0.25",
  "tree-sitter-java>=0.23",
  "tree-sitter-python>=0.23",
  "tree-sitter-javascript>=0.23",
  "tree-sitter-typescript>=0.23",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
anthropic = ["anthropic>=1.12"]
openai = ["openai>=3.0"]
claude-code = ["claude-agent-sdk>=0.2.165"]
all-llms = ["anthropic>=1.12", "openai>=3.0", "claude-agent-sdk>=0.2.165"]

[project.scripts]
task2view = "task2view.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
task2view = ["knowledge/data/*.yaml", "knowledge/data/vb/*.yaml", "knowledge/data/*.json", "contracts/schemas/*.json", "prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
