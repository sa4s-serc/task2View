# Views and Beyond viewpoint catalog (Clements et al., Documenting Software
# Architectures: Views and Beyond, 2nd ed., 2010). 30 entries.
# Design: docs/redesign/01-knowledge-model.md. Vocabulary: ISO/IEC/IEEE 42010:2011.
#
# Per viewpoint:
#   applies_when    repository signals, ANY of which makes a style viewpoint applicable;
#                   empty = generic (applies to every system, V&B §9.2 Step 1)
#   evidence        repository signals, ANY of which is needed to populate the view;
#                   empty = code is enough. None present -> selected with a declared gap.
#   frames          needs this viewpoint is designed to answer (primary)
#   also_covers     needs it answers as a by-product (secondary, used by covering)
#   style_of        C&C styles: the generic viewpoint they specialise
#   combine_with    overlays applied when that viewpoint also applies (V&B §6.6)
#   granularity     caps per Phase 1 detail level (defaults per family below)

signals:
  rest-api: HTTP/REST endpoints exposed by the system
  gui-client: desktop GUI front end
  web-client: browser front end served by or calling the system
  layered: packages or naming that follow a layering scheme (BCED, MVC, controller/service/repository)
  inheritance: architecturally significant type hierarchies or interfaces
  crosscutting: aspects, interceptors, filters
  persisted-data: entities persisted through an ORM, SQL schema or files
  event-bus: publish/subscribe infrastructure (message broker, application events)
  services: independently deployed services, service registry or ESB
  peer-calls: components that both request and provide services to each other
  data-flow: stream or batch processing stages connected by pipes or queues
  shared-repository: a central datastore accessed by many independent components
  multi-tier: separately deployed presentation, application and data tiers
  threads: threads, executors, schedulers
  lifecycle: an element with explicit states (state pattern, status enum with transitions)
  variability: profiles, feature flags, plug-in mechanisms
  deploy-config: deployment descriptors (Dockerfile, compose, k8s, persistence.xml, app server config)
  build-config: build manifests (pom.xml, build.gradle, package.json)
  ownership: CODEOWNERS or multi-author version history
  decision-records: ADRs or documented design decisions
  requirement-docs: requirement or use-case documents
  tests: automated tests

constraints:
  element_kind_allowed: every element kind is one this viewpoint allows
  relation_kind_allowed: every relation kind is one this viewpoint allows
  max_elements: element count within the detail-level cap
  no_package_or_directory_element: no element is named after a source package or directory
  component_has_responsibility: every component or module shows at least one responsibility
  nesting_well_formed: every parent exists and has a kind that may contain the child
  lifeline_is_component_or_actor: sequence lifelines are components or actors, never packages or classes dumps
  messages_ordered: interactions carry a total order
  message_backed_by_call_evidence: every message has call evidence in the AEM
  association_not_fk_field: no association is drawn for a foreign-key field; it is an attribute
  entity_has_attributes: every entity shows its persisted attributes
  one_system_box: exactly one system element, named after the product
  actor_outside_boundary: actors are outside the system boundary
  node_contains_artifact: every artifact is allocated to a node or environment
  relation_has_evidence: every relation is backed by AEM evidence
  no_isolated_element: every element takes part in at least one relation (except groups)

families:
  module:     {granularity: {overview: {max_elements: 6}, feature: {max_elements: 10}, detailed: {max_elements: 15}}}
  cnc:        {granularity: {overview: {max_elements: 6}, feature: {max_elements: 10}, detailed: {max_elements: 15}}}
  allocation: {granularity: {overview: {max_elements: 8}, feature: {max_elements: 12}, detailed: {max_elements: 18}}}
  behavior:   {granularity: {overview: {max_elements: 5}, feature: {max_elements: 8}, detailed: {max_elements: 12}}}
  beyond:     {granularity: {overview: {max_elements: 6}, feature: {max_elements: 10}, detailed: {max_elements: 15}}}

