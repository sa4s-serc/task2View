# ADR-007 D1/D3: the notation of a structural view. The architecture model (parts and connectors,
# contracts/architecture.py) is shared by every view of a request; each view is drawn in the notation
# of its viewpoint, for its reader. Phase 8 checks that the drawing is in the chosen notation.
#
# Technical readers get the notation Views & Beyond documents for the viewpoint:
#   decomposition (V&B 2.2): UML packages nested in each other, containment and no arrows;
#   uses (V&B 2.3): UML dependencies stereotyped <<use>>;
#   layered (V&B 2.5): stacked layers (UML packages) with allowed-to-use arrows;
#   C&C styles (V&B 3, 4): components and connectors with their protocols, drawn as C4 components
#     (box-and-line with technology and intent, Brown's C4 model).
# Overview readers (roles.yaml: audience) get plain boxes and arrows in the system's own words, with
# no technology, stereotypes or class names (V&B 9.2: overview-level documentation; CodeToDiagram
# coding "boxes_and_arrows").

notations:
  uml-package:
    language: graphviz
    label: UML package diagram
    shows: layers contain parts, parts contain their main classes
  uml-dependency:
    language: plantuml
    label: UML component diagram with <<use>> dependencies
    shows: parts and which part depends on which; the changed part highlighted
  c4-component:
    language: plantuml
    label: C4 component diagram
    shows: parts with technology, arrows with intent and protocol
  boxes:
    language: graphviz
    label: boxes and arrows
    shows: parts and what they do, in plain words

technical:
  decomposition: uml-package
  layered: uml-package
  uses: uml-dependency
  cnc-generic: c4-component
  client-server: c4-component
  multi-tier: c4-component
  shared-data: c4-component
  soa: c4-component

overview: boxes

# A person may ask for a family of notations (view spec "notation"); it maps per viewpoint.
families:
  uml: {decomposition: uml-package, layered: uml-package, default: uml-dependency}
  c4: {default: c4-component}
  boxes: {default: boxes}
