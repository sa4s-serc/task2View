# required_information templates keyed by viewpoint id.
# Instantiated with {task_focus} from the task text.

templates:
  scenario:
    - {id_suffix: "1", need: "entry point for {task_focus}"}
    - {id_suffix: "2", need: "orchestration/dispatch component"}
    - {id_suffix: "3", need: "domain service responsible for {task_focus}"}
    - {id_suffix: "4", need: "persistence interaction"}
    - {id_suffix: "5", need: "ordered calls between participants"}
    - {id_suffix: "6", need: "observable validation and failure paths"}

  control-flow:
    - {id_suffix: "1", need: "entry point for {task_focus}"}
    - {id_suffix: "2", need: "call chain from the entry point"}
    - {id_suffix: "3", need: "branching and error paths"}
    - {id_suffix: "4", need: "terminal persistence or external call"}

  module-decomposition:
    - {id_suffix: "1", need: "top-level modules and their responsibilities"}
    - {id_suffix: "2", need: "containment hierarchy"}
    - {id_suffix: "3", need: "module that owns {task_focus}"}

  module-uses:
    - {id_suffix: "1", need: "allowed-to-use relations among modules"}
    - {id_suffix: "2", need: "layer or package boundary crossings"}
    - {id_suffix: "3", need: "uses edges involved in {task_focus}"}

  module-layered:
    - {id_suffix: "1", need: "declared layers"}
    - {id_suffix: "2", need: "allowed dependencies between layers"}
    - {id_suffix: "3", need: "layer that implements {task_focus}"}

  module-generalization:
    - {id_suffix: "1", need: "generalization / specialization hierarchy"}
    - {id_suffix: "2", need: "abstract types involved in {task_focus}"}

  cnc-runtime:
    - {id_suffix: "1", need: "runtime components and connectors"}
    - {id_suffix: "2", need: "communication mechanisms"}
    - {id_suffix: "3", need: "component that handles {task_focus}"}

  allocation-deployment:
    - {id_suffix: "1", need: "deployable artifacts"}
    - {id_suffix: "2", need: "execution environment / nodes"}
    - {id_suffix: "3", need: "mapping of artifacts onto nodes"}

  code-mapping:
    - {id_suffix: "1", need: "architecture element to source file mapping"}
    - {id_suffix: "2", need: "types implementing {task_focus}"}

  api-contract:
    - {id_suffix: "1", need: "externally visible operations"}
    - {id_suffix: "2", need: "request and response types"}
    - {id_suffix: "3", need: "operation that realises {task_focus}"}

  context:
    - {id_suffix: "1", need: "system boundary"}
    - {id_suffix: "2", need: "external actors and systems"}
    - {id_suffix: "3", need: "interfaces used by {task_focus}"}

  data-flow:
    - {id_suffix: "1", need: "data stores"}
    - {id_suffix: "2", need: "flows involved in {task_focus}"}

  data-model:
    - {id_suffix: "1", need: "persistent entities"}
    - {id_suffix: "2", need: "relations among entities used by {task_focus}"}

  trust-boundary:
    - {id_suffix: "1", need: "externally reachable entry points"}
    - {id_suffix: "2", need: "authentication mechanism per entry point"}
    - {id_suffix: "3", need: "trust-zone crossings for {task_focus}"}

  failure-resilience:
    - {id_suffix: "1", need: "failure modes of nodes involved in {task_focus}"}
    - {id_suffix: "2", need: "downstream blast radius"}

  onboarding-path:
    - {id_suffix: "1", need: "system entry points"}
    - {id_suffix: "2", need: "largest subsystems"}
    - {id_suffix: "3", need: "where {task_focus} lives"}

  build-work-assignment:
    - {id_suffix: "1", need: "modules"}
    - {id_suffix: "2", need: "owning team or build unit"}

  decision-record:
    - {id_suffix: "1", need: "recorded architectural decisions"}
    - {id_suffix: "2", need: "decision affecting {task_focus}"}

  concurrency:
    - {id_suffix: "1", need: "concurrent units (threads, processes, actors)"}
    - {id_suffix: "2", need: "synchronisation involved in {task_focus}"}
