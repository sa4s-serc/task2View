# Phase 0 keeps only source files. Rules are inspectable; processing never
# sees documentation, binaries, UML models, or VCS metadata.

source_extensions:
  java: java
  kt: kotlin
  kts: kotlin
  scala: scala
  groovy: groovy
  py: python
  pyi: python
  js: javascript
  mjs: javascript
  cjs: javascript
  jsx: javascript
  ts: typescript
  tsx: typescript
  go: go
  rs: rust
  c: c
  h: c
  cc: cpp
  cpp: cpp
  cxx: cpp
  hpp: cpp
  hh: cpp
  cs: csharp
  rb: ruby
  php: php
  swift: swift
  m: objective-c
  mm: objective-c
  r: r
  jl: julia
  lua: lua
  sh: shell
  bash: shell
  zsh: shell
  sql: sql
  pl: perl
  pm: perl
  ex: elixir
  exs: elixir
  erl: erlang
  hs: haskell
  clj: clojure
  cljs: clojure
  dart: dart
  vue: vue
  svelte: svelte

skip_directories:
  - .git
  - .hg
  - .svn
  - .idea
  - .vscode
  - .venv
  - venv
  - node_modules
  - target
  - build
  - dist
  - out
  - bin
  - obj
  - __pycache__
  - .pytest_cache
  - .mypy_cache
  - .gradle
  - .mvn
  - vendor
  - coverage
  - docs
  - documentation
  - diagrams
  - uml
  - visual-paradigm

skip_extensions:
  - png
  - jpg
  - jpeg
  - gif
  - webp
  - ico
  - svg
  - pdf
  - doc
  - docx
  - ppt
  - pptx
  - xls
  - xlsx
  - csv
  - md
  - rst
  - txt
  - adoc
  - html
  - htm
  - css
  - scss
  - json
  - yaml
  - yml
  - toml
  - xml
  - properties
  - gradle
  - vpp
  - uml
  - puml
  - plantuml
  - mmd
  - drawio
  - form
  - class
  - jar
  - war
  - zip
  - gz
  - tgz
  - 7z
  - exe
  - dll
  - so
  - dylib
  - o
  - a
  - lock
  - log
  - gitignore
  - gitattributes
  - ds_store

max_file_bytes: 1048576
