# Canonical layer names for regrouping view elements.
# Aliases match path segments (case-insensitive). Used by structure grounding
# and the completeness critic (ADR-003). Not a substitute for a recovered
# ground-truth architecture — only a stable vocabulary for BCED / layered /
# hexagonal layouts that student repos actually use.

layers:
  - id: boundary
    name: Boundary
    aliases:
      - boundary
      - boundaries
      - presentation
      - gui
      - view
      - views
      - ui
      - frontend
      - web
  - id: control
    name: Control
    aliases:
      - control
      - controller
      - controllers
      - application
      - service
      - services
      - facade
  - id: entity
    name: Entity
    aliases:
      - entity
      - entities
      - domain
      - model
      - models
  - id: database
    name: Database
    aliases:
      - database
      - persistence
      - repository
      - repositories
      - dao
      - infra
      - infrastructure
      - adapter
      - adapters
