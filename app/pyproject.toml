[project]
name = "t2v-app"
version = "0.1.0"
description = "Local web tool: from a repository and a stakeholder's request to UML architecture views (ISO/IEC/IEEE 42010)"
requires-python = ">=3.11"
dependencies = ["task2view", "Flask>=3.0", "markdown-it-py>=3.0", "PyYAML>=6.0"]

[project.scripts]
t2v-app = "t2v_app.server:main"
t2v-collect = "t2v_app.collect:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["t2v_app*"]

[tool.setuptools.package-data]
t2v_app = ["prompts/*", "data/*", "templates/*", "static/*", "skills/**/*"]
